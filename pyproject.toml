[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyasa"
version = "0.1.2"
description = "Local-first workspace intelligence MCP server."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2,<3"]
build = ["pyinstaller>=6"]

[project.scripts]
vyasa = "vyasa.adapters.cli.main:run"
vyasa-mcp = "vyasa.adapters.mcp.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vyasa = ["data/*.json", "adapters/sqlite/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
