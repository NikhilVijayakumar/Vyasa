name: backend
version: 1
description: >
  Vyasa delivery workflow: the intent-driven lifecycle plus an interface
  and data contract artifact that fixes the MCP tool contract, the local
  index schema, the trust boundary, and migration impact before technical
  design.

# ============================================================
# ARTIFACT LIFECYCLE
#
# proposal -> specs -> api-contract -> design -> adr -> tasks
#
# The api-contract artifact is this repository's addition to the shared
# intent-driven spine: it fixes the interface coding agents and integrations
# build against (MCP tools, CLI commands, the SQLite index, the Google Sheets
# sync format, remote provider calls) before the technical design commits to
# a persistence or service shape.
# ============================================================

artifacts:

  # ----------------------------------------------------------
  # 1. PROPOSAL
  # ----------------------------------------------------------
  - id: proposal
    generates: proposal.md
    description: >
      Defines the problem, intent, scope, constraints, affected components
      and data, and the expected outcome.
    template: proposal.md
    instruction: |
      Establish why the change is needed and what outcome is
      expected before deciding how to implement it.

      Start from the reviewed requirement package under
      `docs/requirements/` and its grill log. Apply the `knowledge-first`
      skill before writing: search `knowledge/` for every topic the change
      touches, create or update missing concepts there first (they must
      stand alone and never reference this change), then cite them under
      Knowledge references.

      Inspect the existing repository, the requirements and architecture
      under `docs/`, existing specs under `openspec/specs/`, and the
      current MCP tool and index schema definitions. Reuse existing
      conventions and decisions.

      Identify scope, exclusions, dependencies, risks, affected
      components (scanner, detectors, index, MCP server, sync, remote
      providers), MCP tools, and stored data. State the roadmap phase
      the change belongs to.

      Apply the backend focus: interface contracts, data model, trust
      boundaries, failure modes, data integrity, provenance of detected
      facts, and migration impact.

      Consult the skills under `skills/backend/` when the change touches
      a boundary: `deterministic-scanner` for scanner or detector work,
      `mcp-contract-review` for MCP tools, `data-ownership-review` for
      metadata, index, or sync fields, `database-integration-testing` for
      the SQLite index, and `mcp-server-review` when repository content,
      credentials, synchronized data, or local paths are affected.

      Consult the `grill-me` skill when available and applicable to
      challenge assumptions before finalizing the proposal.

      Identify the OpenSpec change ID and intended Git branch.
      Keep the proposal limited to one logical change.
    requires: []

  # ----------------------------------------------------------
  # 2. SPECIFICATIONS
  # ----------------------------------------------------------
  - id: specs
    generates: specs/**/*.md
    description: >
      Defines observable requirements and behavioral scenarios with
      traceability to the intended change.
    template: specs.md
    instruction: |
      Define observable, specific, and testable system behavior.

      Reuse the terms and rules of the knowledge concepts cited by the
      proposal; apply `knowledge-first` for any new term the
      specification introduces.

      Use Given/When/Then scenarios where appropriate and consult
      the `gherkin-authoring` skill when available.

      Consult the `test-strategy` skill when available to keep
      requirements verifiable and to place each behavior in the
      verification layer that owns it: unit, contract (MCP tool
      inputs and outputs), integration (filesystem, Git, Sheets,
      provider APIs), or persistence (SQLite).

      Cover positive behavior, negative behavior, validation,
      boundary conditions, and error handling where applicable.
      Unknown, missing, or untrusted evidence is behavior: state what
      the system reports when a fact cannot be established.

      Preserve existing behavior unless the approved change
      explicitly modifies it.

      Reference existing requirements and dependencies.
      Do not invent undocumented product or backend behavior.

      Gherkin scenarios are specifications; they are not
      automatically executable tests without suitable tooling.
    requires:
      - proposal

  # ----------------------------------------------------------
  # 3. API AND DATA CONTRACT (backend addition)
  # ----------------------------------------------------------
  - id: api-contract
    generates: api-contract.md
    description: >
      Fixes the interface contract: MCP tools and CLI commands, payloads,
      error model, trust boundary, data model, and migration impact.
    template: api-contract.md
    instruction: |
      Fix the interface contract before the technical design
      commits to a persistence or service shape.

      Describe every affected operation — MCP tool, CLI command, sync
      exchange, or remote provider call — with its inputs, outputs,
      error responses, and the access it requires. Coding agents build
      against this contract, so an unstated default is a decision
      nobody made.

      State the error model explicitly: which conditions produce which
      error, what shape the error takes, and whether the error leaks
      detail the caller must not see.

      State the trust boundary: which inputs are trusted configuration
      and which are untrusted repository or provider content, which
      paths and data each operation may read or expose, and which data
      is machine-local versus synchronized.

      Describe the data model: entities, fields, types, constraints,
      provenance, and the invariants the SQLite index and the Google
      Sheets layout must hold.

      Describe migration and backward compatibility: how existing
      MCP clients, stored indexes, and synchronized sheets survive the
      change, and the order in which the change is rolled out.

      Trace each operation and field back to the specification
      requirements it satisfies. Record unresolved contract questions
      as explicit open questions.

      Consult `mcp-contract-review` and `api-contract-testing` for
      MCP tool contracts, `data-ownership-review` for field ownership and
      precedence, `database-integration-testing` for persistence
      constraints, and `mcp-server-review` when access, secrets, local
      paths, or synchronized data are affected.
    requires:
      - specs

  # ----------------------------------------------------------
  # 4. DESIGN
  # ----------------------------------------------------------
  - id: design
    generates: design.md
    description: >
      Defines the technical approach, affected components, interfaces,
      data flows, and important trade-offs.
    template: design.md
    instruction: |
      Describe how the approved requirements and the API and data
      contract will be implemented.

      Identify component responsibilities, boundaries, interfaces,
      contracts, data flows, dependencies, and failure handling.

      Consider security, performance, scalability, data integrity, and
      maintainability in proportion to the change.

      Reuse existing architecture and document reasons for
      introducing new patterns or technologies.

      Build on the `knowledge/` concepts the proposal cites and list them
      under Knowledge References. Record a durable decision as a
      `type: Decision` concept in `knowledge/decisions/` rather than only
      in this change.

      Consult the `architecture-review` skill when available and
      applicable, and keep the layer boundaries of
      `knowledge/architecture/system-architecture.md`: MCP adapter,
      application services, scanner and detectors, index repository,
      sync and provider adapters.

      Keep scans bounded and deterministic, and keep untrusted
      repository content out of trusted configuration. Prefer the
      standard library and already-chosen dependencies (Python 3.12+,
      MCP SDK, Pydantic, SQLite, pytest) over new ones.

      Identify significant architectural decisions that require a
      durable ADR. Avoid unnecessary design complexity for small,
      local changes.
    requires:
      - proposal
      - api-contract

  # ----------------------------------------------------------
  # 5. ARCHITECTURE DECISION RECORD
  # ----------------------------------------------------------
  - id: adr
    generates: adr.md
    description: >
      Records significant architectural decisions or explicitly documents
      why no new ADR is required for this change.
    template: adr.md
    instruction: |
      Review the proposed design and determine whether a new durable
      architectural decision is required.

      When a decision is required, document its context, decision,
      alternatives, rationale, trade-offs, and consequences using the
      project's ADR conventions.

      When an existing ADR already covers the decision, reference it
      rather than creating a duplicate.

      When no new architectural decision is needed, explicitly state
      that no new ADR is required and explain briefly why.

      Consult the `architectural-decision-records` skill when
      available. Store each durable decision as a `type: Decision`
      concept in `knowledge/decisions/` (written to stand alone, without
      referencing this change) and reference it from `adr.md`.
    requires:
      - design

  # ----------------------------------------------------------
  # 6. TASKS
  # ----------------------------------------------------------
  - id: tasks
    generates: tasks.md
    description: >
      Defines ordered, traceable implementation and verification tasks
      organized into small, testable vertical slices.
    template: tasks.md
    instruction: |
      Create an actionable checklist based on the approved
      specifications, API and data contract, design, and architectural
      decisions.

      Break work into small, reviewable vertical slices as defined in
      `knowledge/practices/vertical-slices.md`: each slice delivers one
      observable behaviour with its tests and completion evidence; label
      pure enabling work as a prerequisite. Reference the knowledge
      concepts each slice depends on.

      Map tasks to requirements, contract operations, and acceptance
      scenarios where practical.

      Include implementation, testing, verification, and necessary
      migration and documentation work.

      Follow the `test-driven-development` skill when available, with
      `pytest-skill` for pytest patterns.
      Plan Red-Green-Refactor cycles for applicable code changes.

      Use the `acceptance-test-authoring` skill to turn specifications
      and contract expectations into verifiable acceptance checks.

      Use the `test-strategy` skill when available to choose the
      verification layer for each task, using the skills under
      `skills/backend/`.

      Include applicable quality checks and explicit completion
      criteria. Keep all tasks within the approved scope.

      Do not mark work complete before it has been performed and its
      result verified.
    requires:
      - specs
      - design
      - adr

# ============================================================
# IMPLEMENTATION GATE
# ============================================================

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Implement only the approved OpenSpec change.

    Before modifying code:
    - Follow the `openspec-git-discipline` skill.
    - Confirm the correct feature or fix branch.
    - Review the approved proposal, specifications, API and data
      contract, design, ADR decision, and tasks.
    - Inspect the relevant project conventions and skills.
    - Select `deterministic-scanner` for scanner and detector code,
      `mcp-contract-review` and `api-contract-testing` for MCP tools,
      `data-ownership-review` for metadata and sync fields, and
      `database-integration-testing` for index schema or migration changes.
    - Confirm the required implementation tasks are actionable.

    During implementation:
    - Follow the project's technology-specific conventions.
    - Use Red-Green-Refactor for applicable code changes.
    - Implement one testable vertical slice at a time.
    - Treat repository files, manifests, and provider responses as
      untrusted input; never execute repository code while scanning.
    - Run relevant tests and quality checks.
    - When a check fails, consult the `test-debugging` skill when
      available to diagnose it with evidence; never weaken or delete
      a test to make implementation pass.
    - Do not weaken requirements or tests merely to make
      implementation pass.
    - Keep task checkboxes synchronized with actual progress.
    - Do not introduce unrelated changes or bypass Git safeguards.

    Before considering implementation complete:
    - Verify the implementation against the approved requirements and
      the API and data contract.
    - Use the `code-reviewer` skill to review the change, and
      `code-review-security` plus `secrets-scan` for its security pass;
      `sca-audit` when dependencies change.
    - Before declaring a roadmap phase complete, run
      `phase-gate-verification`.
    - Report tests and checks actually executed.
    - Identify failures, skipped checks, unavailable tooling, and
      unresolved verification gaps.
    - Do not claim successful verification without evidence.
