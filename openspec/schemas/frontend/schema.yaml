name: frontend
version: 1
description: >
  Frontend delivery workflow: the intent-driven lifecycle plus a UI/UX
  contract artifact that fixes screens, states, interaction, accessibility,
  and localization before technical design starts.

# ============================================================
# ARTIFACT LIFECYCLE
#
# proposal -> specs -> ui-spec -> design -> adr -> tasks
#
# The ui-spec artifact is the frontend team's addition to the shared
# intent-driven spine: it fixes the user-facing contract before the
# technical design commits to components, state, and data flow.
# ============================================================

artifacts:

  # ----------------------------------------------------------
  # 1. PROPOSAL
  # ----------------------------------------------------------
  - id: proposal
    generates: proposal.md
    description: >
      Defines the problem, intent, scope, constraints, affected screens
      and components, and the expected frontend outcome.
    template: proposal.md
    instruction: |
      Establish why the change is needed and what outcome is
      expected before deciding how to implement it.

      Inspect the existing repository and relevant project
      documentation. Reuse existing conventions and decisions.

      Identify scope, exclusions, dependencies, risks, affected
      screens and components, and whether architecture or UI/UX is
      affected.

      This is the frontend team's workflow. Apply the frontend focus:
      UI/UX impact, affected screens and components, accessibility and
      localization behaviour, component behaviour, and browser-level
      verification.

      Consult the frontend skills under `skills/frontend/` when the
      change touches UI: `ui-ux-pro-max` for design-system decisions,
      `frontend-design` for production UI restraint, and `react-testing`,
      `playwright-testing`, and `accessibility-testing` for the
      verification layer that applies.

      Consult the `grill-me` skill when available and applicable to
      challenge assumptions before finalizing the proposal.

      Identify the OpenSpec change ID and intended Git branch.
      Keep the proposal limited to one logical change.
    requires: []

  # ----------------------------------------------------------
  # 2. SPECIFICATIONS
  # ----------------------------------------------------------
  - id: specs
    generates: specs/**/*.md
    description: >
      Defines observable requirements and behavioral scenarios with
      traceability to the intended change.
    template: specs.md
    instruction: |
      Define observable, specific, and testable system behavior.

      Use Given/When/Then scenarios where appropriate and consult
      the `gherkin-authoring` skill when available.

      Consult the `test-strategy` skill when available to keep
      requirements verifiable and to place each behavior in the
      frontend verification layer that owns it: component test,
      browser-level journey, or accessibility check.

      Cover positive behavior, negative behavior, validation,
      boundary conditions, and error handling where applicable.

      Preserve existing behavior unless the approved change
      explicitly modifies it.

      Reference existing requirements and dependencies.
      Do not invent undocumented product or backend behavior.

      Gherkin scenarios are specifications; they are not
      automatically executable tests without suitable tooling.
    requires:
      - proposal

  # ----------------------------------------------------------
  # 3. UI/UX CONTRACT (frontend addition)
  # ----------------------------------------------------------
  - id: ui-spec
    generates: ui-spec.md
    description: >
      Fixes the user-facing contract: screens, states, interaction model,
      responsive behaviour, accessibility, and localization expectations.
    template: ui-spec.md
    instruction: |
      Fix the user-facing contract before the technical design
      commits to components, state, and data flow.

      Describe every affected screen or component, the states it can
      be in, and the behaviour of each state. A state that is not
      described here is a state that will be discovered during
      implementation.

      Cover the states that frontend changes routinely miss: loading,
      empty, error, partial, disabled, and permission-dependent
      variants.

      State the accessibility contract: keyboard reachability and
      focus order, accessible names and roles, announcements of
      dynamic changes, and contrast or target-size expectations.

      State the localization expectations: translatable copy,
      pluralization, date and number formats, and layouts that must
      tolerate longer translated strings.

      Trace each screen and state back to the specification
      requirements it satisfies. Record open visual questions as
      explicit open questions rather than silent assumptions.

      Consult `ui-ux-pro-max` when the change makes a design-system
      decision, `frontend-design` when reviewing implemented screens
      for hierarchy, spacing, and copy, and
      `accessibility-testing` and `localization-accessibility-review`
      when the change has accessibility or localization impact.
    requires:
      - specs

  # ----------------------------------------------------------
  # 4. DESIGN
  # ----------------------------------------------------------
  - id: design
    generates: design.md
    description: >
      Defines the technical approach, affected components, interfaces,
      data flows, and important trade-offs for the frontend.
    template: design.md
    instruction: |
      Describe how the approved requirements and the UI/UX contract
      will be implemented.

      Identify component responsibilities, boundaries, interfaces,
      contracts, data flows, dependencies, and failure handling.

      Consider security, performance, scalability, accessibility, and
      maintainability in proportion to the change.

      Reuse existing architecture and document reasons for
      introducing new patterns or technologies.

      Consult the `architecture-review` skill when available and
      applicable, and the frontend engineering skills under
      `skills/frontend/` for the patterns this project already uses
      (`react-best-practices`, `feature-arch`, `tanstack-query`,
      `react-hook-form`, `msw`).

      Identify significant architectural decisions that require a
      durable ADR. Avoid unnecessary design complexity for small,
      local changes.
    requires:
      - proposal
      - ui-spec

  # ----------------------------------------------------------
  # 5. ARCHITECTURE DECISION RECORD
  # ----------------------------------------------------------
  - id: adr
    generates: adr.md
    description: >
      Records significant architectural decisions or explicitly documents
      why no new ADR is required for this change.
    template: adr.md
    instruction: |
      Review the proposed design and determine whether a new durable
      architectural decision is required.

      When a decision is required, document its context, decision,
      alternatives, rationale, trade-offs, and consequences using the
      project's ADR conventions.

      When an existing ADR already covers the decision, reference it
      rather than creating a duplicate.

      When no new architectural decision is needed, explicitly state
      that no new ADR is required and explain briefly why.

      Consult the `architectural-decision-records` skill when
      available. Store durable decisions according to the consuming
      project's knowledge and documentation policy.
    requires:
      - design

  # ----------------------------------------------------------
  # 6. TASKS
  # ----------------------------------------------------------
  - id: tasks
    generates: tasks.md
    description: >
      Defines ordered, traceable implementation and verification tasks
      organized into small, testable vertical slices.
    template: tasks.md
    instruction: |
      Create an actionable checklist based on the approved
      specifications, UI/UX contract, design, and architectural
      decisions.

      Break work into small, reviewable vertical slices.

      Map tasks to requirements, UI states, and acceptance scenarios
      where practical.

      Include implementation, testing, verification, and necessary
      documentation work.

      Follow the `test-driven-development` skill when available.
      Plan Red-Green-Refactor cycles for applicable code changes.

      Use the `acceptance-test-authoring` skill to turn specifications
      and UI states into verifiable acceptance checks.

      Use the `test-strategy` skill when available to choose the
      verification layer for each task: component test, browser-level
      journey, or accessibility check, using the frontend skills
      under `skills/frontend/`.

      Include applicable quality checks and explicit completion
      criteria. Keep all tasks within the approved scope.

      Do not mark work complete before it has been performed and its
      result verified.
    requires:
      - specs
      - design
      - adr

# ============================================================
# IMPLEMENTATION GATE
# ============================================================

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Implement only the approved OpenSpec change.

    Before modifying code:
    - Follow the `openspec-git-discipline` skill.
    - Confirm the correct feature or fix branch.
    - Review the approved proposal, specifications, UI/UX contract,
      design, ADR decision, and tasks.
    - Inspect the relevant project conventions and skills.
    - Confirm the required implementation tasks are actionable.

    During implementation:
    - Follow the project's technology-specific conventions.
    - Use Red-Green-Refactor for applicable code changes.
    - Implement one testable vertical slice at a time.
    - Implement every state described in the UI/UX contract.
    - Run relevant tests and quality checks.
    - When a check fails, consult the `test-debugging` skill when
      available to diagnose it with evidence; never weaken or delete
      a test to make implementation pass.
    - Do not weaken requirements or tests merely to make
      implementation pass.
    - Keep task checkboxes synchronized with actual progress.
    - Do not introduce unrelated changes or bypass Git safeguards.

    Before considering implementation complete:
    - Verify the implementation against the approved requirements and
      the UI/UX contract.
    - Use the `code-reviewer` skill to review the change.
    - Report tests and checks actually executed.
    - Identify failures, skipped checks, unavailable tooling, and
      unresolved verification gaps.
    - Do not claim successful verification without evidence.
